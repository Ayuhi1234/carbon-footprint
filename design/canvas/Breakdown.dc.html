<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category Breakdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Mukta,sans-serif;background:#F5F3EA}
a{color:#0A5F42}a:hover{color:#13261D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EA; color: #13261D; font-family: Mukta, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="Result.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #13261D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg></a>
    <div style="flex-grow: 1; font-size: 17px; font-weight: 700">Breakdown</div>
  </div>

  <div style="flex-grow: 1; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 26px; line-height: 32px; font-weight: 700">Where your footprint comes from</h1>
      <div style="font-size: 15px; line-height: 22px; color: #4B5B53">Total 184 kg CO₂e / month</div>
    </div>

    <div style="display: flex; gap: 14px; align-items: center; padding: 18px; border-radius: 20px; background: #EEF7F1">
      <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; background: #0E7A55; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg></div>
      <div style="display: flex; flex-direction: column">
        <div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; color: #0A5F42">YOUR BIGGEST CONTRIBUTOR</div>
        <div style="font-family: 'Baloo 2', sans-serif; font-size: 22px; line-height: 28px; font-weight: 700">Transport — 72 kg CO₂e</div>
        <div style="font-size: 14px; line-height: 20px; color: #4B5B53">39% of your monthly footprint</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DDE3DC; border-radius: 20px; padding: 6px 16px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
        <div style="padding: 10px 0; display: flex; flex-direction: column; gap: 6px; border-bottom: {{ r.border }}">
          <div style="display: flex; align-items: center; gap: 8px">
            <div style="flex-grow: 1; font-size: 15px; line-height: 20px; font-weight: 600">{{ r.label }}</div>
            <sc-if value="{{ r.top }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; line-height: 18px; font-weight: 700; padding: 0 8px; border-radius: 999px; background: #0E7A55; color: #FFFFFF">Biggest</span></sc-if>
            <div style="font-size: 15px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums">{{ r.kg }} kg</div>
            <div style="width: 38px; text-align: right; font-size: 14px; line-height: 20px; color: #5F6E66; font-variant-numeric: tabular-nums">{{ r.pct }}%</div>
          </div>
          <div style="height: 8px; border-radius: 4px; background: #EEF7F1">
            <div style="height: 8px; border-radius: 4px; width: {{ r.width }}; background: {{ r.fill }}"></div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 12px; line-height: 16px; color: #5F6E66">Tap a category to see the answer it came from.</div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #DDE3DC">
    <a href="Tips.dc.html" style="height: 52px; border-radius: 999px; background: #0E7A55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">See How to Improve</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Transport', 72, 39], ['Electricity', 46, 25], ['Diet', 34, 18],
      ['Waste', 14, 8], ['Flights', 12, 7], ['Water', 6, 3]
    ];
    const max = 72;
    return {
      rows: data.map(([label, kg, pct], i) => ({
        label, kg, pct, top: i === 0,
        width: Math.round((kg / max) * 100) + '%',
        fill: i === 0 ? '#0E7A55' : '#8CCBA6',
        border: i === data.length - 1 ? '0' : '1px solid #DDE3DC'
      }))
    };
  }
}
</script>
</body>
</html>
