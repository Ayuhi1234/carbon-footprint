<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carbon Footprint Result</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&amp;family=Mukta:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Mukta,sans-serif;background:#F5F3EA}
a{color:#0A5F42}a:hover{color:#13261D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EA; color: #13261D; font-family: Mukta, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px">
    <a href="Main.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #13261D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg></a>
    <div style="flex-grow: 1; font-size: 17px; font-weight: 700">Your Result</div>
  </div>

  <div style="flex-grow: 1; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; align-items: center; text-align: center">
      <div style="font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em; color: #0A5F42">YOUR CARBON FOOTPRINT</div>
      <div aria-label="184 kilograms CO2 equivalent per month" style="display: flex; align-items: baseline; gap: 6px; margin-top: 4px">
        <span style="font-family: 'Baloo 2', sans-serif; font-size: 64px; line-height: 64px; font-weight: 700">184</span>
        <span style="font-size: 17px; font-weight: 600; color: #4B5B53">kg CO₂e / month</span>
      </div>
      <div style="font-size: 15px; line-height: 22px; color: #4B5B53; margin-top: 2px">2,208 kg CO₂e / year</div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DDE3DC; border-radius: 20px; padding: 16px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div role="img" aria-label="Carbon score 68 out of 100, Medium Impact" style="position: relative; width: 200px; height: 176px">
        <svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; top: 0; left: 0">
          <circle cx="100" cy="100" r="84" fill="none" stroke="#DCEFE3" stroke-width="16" stroke-linecap="round" stroke-dasharray="395.84 527.79" transform="rotate(135 100 100)"></circle>
          <circle cx="100" cy="100" r="84" fill="none" stroke="#C77700" stroke-width="16" stroke-linecap="round" stroke-dasharray="269.17 527.79" transform="rotate(135 100 100)"></circle>
        </svg>
        <div style="position: absolute; top: 58px; left: 0; width: 200px; display: flex; flex-direction: column; align-items: center">
          <div style="display: flex; align-items: baseline; gap: 2px"><span style="font-family: 'Baloo 2', sans-serif; font-size: 44px; line-height: 48px; font-weight: 700">68</span><span style="font-size: 15px; color: #5F6E66">/ 100</span></div>
          <div style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: #F5F3EA; font-size: 14px; font-weight: 700; margin-top: 4px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #C77700"></span>Medium Impact</div>
        </div>
      </div>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 6px">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
          <div style="height: 8px; border-radius: 4px; background: #1E8E5A; opacity: 0.35"></div>
          <div style="height: 8px; border-radius: 4px; background: #C77700"></div>
          <div style="height: 8px; border-radius: 4px; background: #C8472D; opacity: 0.35"></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-size: 13px; line-height: 18px; text-align: center; color: #5F6E66">
          <div>Low</div>
          <div style="color: #13261D; font-weight: 700">▲ Medium</div>
          <div>High</div>
        </div>
      </div>
    </div>

    <a href="Breakdown.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: #EEF7F1; text-decoration: none; color: #13261D">
      <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #0E7A55; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg></div>
      <div style="flex-grow: 1; font-size: 15px; line-height: 21px">Biggest contributor: <strong>Transport · 72 kg</strong></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5B53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <a href="MethodSheet.dc.html" style="font-size: 15px; font-weight: 600; min-height: 32px; display: flex; align-items: center">How is this calculated?</a>
      <div style="font-size: 12px; line-height: 16px; color: #5F6E66">Calculated 28 Sep 2026 · Conversion factors v{factorVersion}</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 20px 24px; background: #FFFFFF; border-top: 1px solid #DDE3DC">
    <a href="Breakdown.dc.html" style="height: 52px; border-radius: 999px; background: #0E7A55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">See Breakdown</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
